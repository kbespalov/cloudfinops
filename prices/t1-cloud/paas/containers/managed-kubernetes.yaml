  # Kubernetes» в том же PDF недоступен для нового заказа — Tiny и старые
  # строки Containers сюда не переносим.
  - sku: t1.kubernetes.master-small
    name: Зональный мастер Small
    meter: containers.kubernetes.control-plane
    status: available
    pricingMode: fixed
    region: Россия
    effectiveFrom: '2026-07-13'
    checkedAt: '2026-07-27'
    sourceRefs:
    - t1.rates-pdf-2026-07-13
    - t1.kubernetes
    dimensions:
      published30Days: 5417
      vatRatePercent: 22
      nativeVat: excluded
      availability: zonal
      faultTolerant: false
      topology: zonal
      comparabilityClass: native-fixed
      comparableTier: basic
      masterCount: 1
      masterSize: small
    pricing:
      rate:
        amount: '0.12539352'
        currency: RUB
        unit:
          quantity: master
          period: minute
        vat: excluded
        byteBasis: not-applicable
      normalized:
        amount: '9.1788057'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: 0.12539352 × 60 × 1.22 VAT
        vat: included
    notes: >
      Фиксированная цена за управляющий слой Kubernetes в T1 Cloud: один мастер
      размера Small в одной зоне. В цену не входят рабочие ноды — их считают
      отдельно. Точный объём CPU и памяти внутри пакета в публичном прайсе не
      указан, поэтому с другими облаками удобнее сравнивать по итоговой сумме,
      а не по «2 vCPU / 4 ГиБ».
