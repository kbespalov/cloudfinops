          period: month
        formula: 2916.67 × 1.22 VAT
        vat: included
    notes: >
      2 916,67 ₽/мес без НДС → ≈3 558,34 ₽ с НДС 22%. В первый/последний месяц
      возможна пропорция по дням (сноска в приложении). Источник: PDF + CDN.

