    dimensions:
      nativeName: CDN. Экранирование (шилдинг)
      nativeUnit: шт / месяц
      nativeAmountExcluded: '2916.67'
      vatRatePercent: 22
      nativeVat: excluded
      comparabilityClass: optional-addon
      sourceDocument: Prilozhenie_1_Tarifnoe_prilozhenie_08_07_2026
    pricing:
