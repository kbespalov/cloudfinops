apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: t1-cloud
  layer: iaas
  service: cdn
  category: iaas.cdn
  title: Cloud CDN
spec:
  meters:
  - sku: t1.cdn.traffic.egress
    name: Исходящий трафик CDN
    meter: cdn.traffic.egress
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: '2026-07-13'
    checkedAt: '2026-07-25'
    sourceRefs: [t1.rates-pdf-2026-07-13, t1.rates, t1.cdn]
    dimensions:
      coverage: default
      trafficScope: cdn-to-client
      nativeName: CDN трафик
      nativeUnit: ГБ
      nativeAmountExcluded: '1.00'
      vatRatePercent: 22
      nativeVat: excluded
      comparabilityClass: egress-payg
      sourceDocument: Prilozhenie_1_Tarifnoe_prilozhenie_08_07_2026
    pricing:
      rate:
        amount: '1.00'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: excluded
        byteBasis: binary
      normalized:
        amount: '1.22'
        unit:
          currency: RUB
          quantity: GiB
          period: usage
        formula: 1.00 × 1.22 VAT
        vat: included
    notes: >
      В тарифном приложении T1 (08.07.2026, с 13.07.2026) — 1,00 ₽/ГБ без НДС.
      В каталоге для сравнения показаны 1,22 ₽/GiB с НДС 22% (норма каталога
      prices/index.yaml). Подключение сервиса и создание ресурсов бесплатны.
      Платите за исходящий трафик. Региональные ставки — отдельные SKU.
      Источники: PDF тарифного приложения, страница rates, страница CDN.

  - sku: t1.cdn.traffic.egress.europe
    name: Исходящий трафик CDN · Европа
    meter: cdn.traffic.egress
    status: available
    pricingMode: unit
    region: Европа
    effectiveFrom: '2026-07-13'
    checkedAt: '2026-07-25'
    sourceRefs: [t1.rates-pdf-2026-07-13, t1.cdn]
    dimensions:
      coverage: europe
      trafficScope: cdn-to-client
      nativeName: CDN трафик, регион Европа
      nativeUnit: ГБ
      nativeAmountExcluded: '1.42'
      vatRatePercent: 22
      nativeVat: excluded
      comparabilityClass: egress-regional
      sourceDocument: Prilozhenie_1_Tarifnoe_prilozhenie_08_07_2026
    pricing:
      rate:
        amount: '1.42'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: excluded
        byteBasis: binary
      normalized:
        amount: '1.7324'
        unit:
          currency: RUB
          quantity: GiB
          period: usage
        formula: 1.42 × 1.22 VAT
        vat: included
    notes: >
      1,42 ₽/ГБ без НДС → 1,7324 ₽/GiB с НДС 22%. Не базовая ставка РФ.
      Источник: тарифное приложение PDF + страница CDN.

