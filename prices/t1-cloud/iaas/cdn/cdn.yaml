  - sku: t1.cdn.requests
    name: Запросы CDN
    meter: cdn.requests
    status: available
    pricingMode: unit
    region: —
    effectiveFrom: '2026-07-13'
    checkedAt: '2026-07-25'
    sourceRefs: [t1.rates-pdf-2026-07-13, t1.cdn]
    dimensions:
      freeTierRequestsMonth: 100000000
      billablePackRequests: 10000
      nativeName: CDN запросы (более 100 млн)
      nativeUnit: 10000 шт
      nativeAmountExcluded: '0.67'
      vatRatePercent: 22
      nativeVat: excluded
      comparabilityClass: requests-overage
      sourceDocument: Prilozhenie_1_Tarifnoe_prilozhenie_08_07_2026
    pricing:
      rate:
        amount: '0.67'
        currency: RUB
        unit: {quantity: 10k-request, period: usage}
        vat: excluded
        byteBasis: not-applicable
      normalized:
        amount: '0.8174'
        unit:
          currency: RUB
          quantity: 10k-request
          period: usage
        formula: 0.67 × 1.22 VAT
        vat: included
    notes: >
      Сверх 100 млн запросов/мес: 0,67 ₽ без НДС за 10 000 шт → 0,8174 ₽ с НДС
      22% за те же 10 тыс. В каталоге CDN-запросы всех провайдеров — за 10 тыс.
      (у Yandex native pack 100 тыс. / 1 ₽ → 0,10 ₽/10 тыс.). Источник: PDF + CDN.

