apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: selectel
  layer: paas
  service: ai
  category: paas.ai.inference
  title: Token Factory — inference tokens
# Selectel Token Factory: OpenAI-compatible token API in Selectel DCs.
# Rates are the figures on the model card in the control panel on 2026-10-22,
# ₽ per 1M tokens, VAT included — same unit as Yandex / MWS / Cloud.ru.
# Cached on these cards is about 10% of input (panel rounding). Reasoning
# equals output and is a separate counter, not a second charge on top of output.
# modelId matches a peer only when it is the same model:
#   deepseek-v4-flash — same id as Yandex AI Studio (300 / 500 ₽)
#   glm-5.3-flash     — not MWS glm-5.3 (178.12 / 746.64 ₽)
#   kimi-k2.7-code    — not kimi-k2.6 (MWS 157.38 / 652.70 ₽)
#   qwen3.8-27b / qwen3.8-flash-next — not Qwen3.8 Max (~2.4T, no token price here)
#   deepseek-v4.1-flash (Yandex / Cloud.ru) is a different id
# Context windows are the Selectel card, not the weight-card maximum.
# Parameter counts are the official Hugging Face cards (zai-org/GLM-5.3-Flash,
# moonshotai/Kimi-K2.7-Code, Qwen/Qwen3.8-Flash-Next); the panel shows none.
# modelLineage links related models across providers (glm-5, kimi-k2, qwen3.8);
# it is not an exact-peer key — modelId still is.
# No public price page yet; numeric source is the logged-in Token Factory panel.
spec:
  meters:
  - sku: selectel.ai.glm-5.3-flash.input
    name: GLM 5.3 Flash · input
    meter: ai.inference.tokens.input
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: null
    checkedAt: '2026-10-22'
    sourceRefs: [selectel.token-factory, selectel.token-factory-announce]
    dimensions:
      modelFamily: glm-5.3-flash
      modelId: glm-5.3-flash
      modelLineage: glm-5
      providerModelAlias: glm-5.3-flash
      openWeights: true
      modelCapability: text-generation
      inferenceScope: local
      serviceProduct: token-factory
      inferenceMode: synchronous
      tokenDirection: input
      releaseChannel: beta
      contextWindowTokens: 262144
      parameterCountB: 320
      activeParameterCountB: 18
    notes: >
      Token Factory, бета. Ставка панели за 1 млн входных токенов, с НДС.
      Это не GLM 5.3 из MWS GPT Model Hub (modelId glm-5.3, 178,12 / 746,64 ₽):
      другая модель (320B / 18B active против 753B / 40B), общая только линейка glm-5.
      Параметры — карточка zai-org/GLM-5.3-Flash на Hugging Face.
    pricing:
      rate:
        amount: '74.64'
        currency: RUB
        unit: {quantity: 1M-token, period: usage}
        vat: included
        byteBasis: not-applicable
