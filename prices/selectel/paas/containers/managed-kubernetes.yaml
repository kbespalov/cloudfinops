apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: selectel
  layer: paas
  service: containers
  category: paas.containers.managed-kubernetes
  title: Managed Kubernetes
spec:
  meters:
  - sku: selectel.kubernetes.master-basic
    name: Мастер Kubernetes · базовый · плата за кластер
    meter: containers.kubernetes.control-plane
    status: available
    pricingMode: fixed
    region: Санкт-Петербург / ru-9
    effectiveFrom: '2026-07-01'
    checkedAt: '2026-07-17'
    sourceRefs:
    - selectel.prices
    - selectel.calculator
    - selectel.k8s-rules
    dimensions:
      sizingModel: cluster-fee
      nativeName: Базовый кластер, 1 master
      topology: basic
      availability: zonal
      faultTolerant: false
      masterCount: 1
      masterSize: small
      poolDependent: true
      comparabilityClass: native-fixed
      comparableTier: basic
    pricing:
      rate:
        amount: '8.16'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '8.16'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: native hourly master rate
        vat: included
    notes: >
      Готовый тариф Selectel на зональный (базовый) мастер Kubernetes — одна
      фиксированная цена в месяц/час (пул ru-9). Сколько именно vCPU и RAM внутри
      мастера, в публичном прайсе не указано: с пакетами «2 vCPU / 4 ГиБ» других
      облаков сравнивайте только по итоговой сумме. Рабочие ноды — отдельно.
  - sku: selectel.kubernetes.master-ha
    name: Мастер Kubernetes · HA · плата за кластер
    meter: containers.kubernetes.control-plane
    status: available
    pricingMode: fixed
    region: Санкт-Петербург / ru-9
    effectiveFrom: '2026-07-01'
    checkedAt: '2026-07-17'
    sourceRefs:
    - selectel.prices
    - selectel.calculator
    - selectel.k8s-rules
    dimensions:
      sizingModel: cluster-fee
      nativeName: Отказоустойчивый кластер, 3 master
      topology: high-availability
      availability: regional
      faultTolerant: true
      masterCount: 3
      masterSize: small
      poolDependent: true
      comparabilityClass: native-fixed
      comparableTier: ha
    pricing:
      rate:
        amount: '23.40'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '23.40'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: native hourly master rate
        vat: included
    notes: >
      Готовый тариф Selectel на отказоустойчивый мастер Kubernetes: три
      мастер-узла, одна фиксированная цена (пул ru-9). Конфигурацию CPU/RAM
      внутри мастеров прайс не раскрывает — с оценками «3×(2 vCPU / 4 ГиБ)»
      других облаков сравнивайте только по итоговой сумме. Рабочие ноды —
      отдельно.
