  - sku: vk.kubernetes.master-vcpu
    name: Ресурсы мастера Kubernetes · vCPU
    meter: containers.kubernetes.control-plane.vcpu
    status: available
    pricingMode: unit
    region: Москва
    effectiveFrom: '2026-01-12'
    checkedAt: '2026-07-27'
    sourceRefs:
    - vk.pricelist
    - vk.k8s-rules
    dimensions:
      nativeName: Master CPU, Intel Cascade Lake
      component: master vCPU
      cpuPlatformFamily: intel-cascade-lake
      published30Days: 983.51
    pricing:
      rate:
        amount: '0.022766'
        currency: RUB
        unit:
          quantity: vCPU
          period: minute
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '1.36596'
        unit:
          currency: RUB
          quantity: vCPU
          period: hour
        formula: 0.022766 × 60
        vat: included
    notes: >
      Ставка за 1 vCPU мастера (Intel Cascade Lake). Готовой «строки мастера»
      в прайсе нет — цену собирают из vCPU и RAM. В каталоге ниже — собранные
      формы 2/6 (типичный старт), 2/8 и 2/4 (*).
