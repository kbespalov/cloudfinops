      - vk.kubernetes.master-ram
      vatRatePercent: 22
    pricing:
      rate:
        amount: '4.95852'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '4.95852'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: 2 × 1.36596 (vCPU) + 6 × 0.3711 (GiB-RAM)
        vat: included
    notes: >
      Синтетическая оценка Cloud FinOps (*), не отдельная строка прайса VK Cloud.
      Зачем: в доках Cloud Containers при создании кластера по умолчанию —
      2 CPU / 6 GB (шаблон STD2-2-6) с обязательным вертикальным автоскейлом;
      от этой формы удобно сравнивать зональные мастера. Как считаем:
      2×1,36596 + 6×0,3711 = 4,95852 ₽/ч с НДС. Рабочие ноды не входят.
