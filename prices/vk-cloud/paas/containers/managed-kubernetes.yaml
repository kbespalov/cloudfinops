    pricing:
      rate:
        amount: '0.006185'
        currency: RUB
        unit:
          quantity: GiB-RAM
          period: minute
        vat: included
        byteBasis: binary
      normalized:
        amount: '0.3711'
        unit:
          currency: RUB
          quantity: GiB-RAM
          period: hour
        formula: 0.006185 × 60
        vat: included
    notes: >
      Ставка за 1 ГиБ RAM мастера. Вместе со ставкой vCPU даёт цену управляющего
      слоя. Собранные формы — в строках 2/6 · 2/8 · 2/4 ниже (*).
