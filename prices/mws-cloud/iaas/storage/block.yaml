apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: mws-cloud
  layer: iaas
  service: storage
  category: iaas.storage.block
  title: Block storage
spec:
  meters:
  - sku: mws.disk.nbs-pl2
    name: Объем диска NBS-PL2
    meter: storage.block.capacity
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: '2026-08-01'
    checkedAt: '2026-08-01'
    sourceRefs:
    - mws.all-prices
    - mws.compute
    dimensions:
      publishedMonth: 8.95968
      iopsChargedSeparately: true
      performanceTier: provisioned-iops
      nativePerformanceTier: nbs-pl2
      diskType: nbs-pl2
      storageMedia: ssd
      storageInterface: nvme
      storageTopology: network
      includedIops: 1000
      maximumIops: 10000
    pricing:
      rate:
        amount: '0.012444'
        currency: RUB
        unit:
          quantity: GiB
          period: hour
        vat: included
        byteBasis: binary
      normalized:
        amount: '0.012444'
        unit:
          currency: RUB
          quantity: GiB
          period: hour
        formula: native hourly rate
        vat: included
    notes: >
      Сетевой диск среднего класса: в цену объёма входят 1 000 IOPS (~32 МиБ/с),
      лимит 1 000–10 000. Доп. IOPS — отдельная позиция (в прайсе пачками по 100;
      в каталоге — ₽ за 1 IOPS·час). Ближе к Selectel «Универсальный SSD v2»,
      чем к «Быстрому SSD v2» (база 25 000).
  - sku: mws.disk.nbs-pl2-iops
    name: Дополнительная производительность диска NBS-PL2
    meter: storage.block.iops
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: null
    checkedAt: '2026-08-01'
    sourceRefs:
    - mws.all-prices
    - mws.compute
    dimensions:
      performanceTier: provisioned-iops
      nativePerformanceTier: nbs-pl2
      diskType: nbs-pl2
      storageMedia: ssd
      storageInterface: nvme
      storageTopology: network
      nativeBillingStepIops: 100
      nativeHourlyAmountPerStep: '0.0339'
      iopsChargedSeparately: true
      includedIops: 1000
      maximumIops: 10000
    pricing:
      rate:
        amount: '0.000339'
        currency: RUB
        unit:
          quantity: IOPS
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '0.000339'
        unit:
          currency: RUB
          quantity: IOPS
          period: hour
        formula: 0.0339 RUB per 100 IOPS-hour / 100
        vat: included
    notes: >
      Доп. IOPS сверх включённых 1 000 (макс. 10 000). В прайсе 0,0339 ₽/ч за пачку
      100 IOPS → в каталоге 0,000339 ₽/IOPS·час. Не сравнивайте напрямую с Selectel
      «Быстрый SSD v2» без учёта включённой базы и класса диска.
  - sku: mws.compute.image.capacity
    name: Образ ВМ
    meter: storage.image.capacity
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: '2026-08-01'
    checkedAt: '2026-08-01'
    sourceRefs:
    - mws.all-prices
    - mws.compute
    dimensions:
      publishedMonth: 3.5136
    pricing:
      rate:
        amount: '0.00488'
        currency: RUB
        unit:
          quantity: GiB
          period: hour
        vat: included
        byteBasis: binary
      normalized:
        amount: '0.00488'
        unit:
          currency: RUB
          quantity: GiB
          period: hour
        formula: native hourly rate
        vat: included
    notes: MWS считает 1 ГБ равным 2^30 байт; месячная цена рассчитана провайдером для 720 часов.
  - sku: mws.compute.snapshot.capacity
    name: Снимок диска
    meter: storage.snapshot.capacity
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: '2026-08-01'
    checkedAt: '2026-08-01'
    sourceRefs:
    - mws.all-prices
    - mws.compute
    dimensions:
      publishedMonth: 3.5136
      billingBasis: actual-stored-data
      nativeName: Объем резервных копий дисков
    pricing:
      rate:
        amount: '0.00488'
        currency: RUB
        unit:
          quantity: GiB
          period: hour
        vat: included
        byteBasis: binary
      normalized:
        amount: '0.00488'
        unit:
          currency: RUB
          quantity: GiB
          period: hour
        formula: native hourly rate
        vat: included
    notes: >
      У MWS позиция называется «Объем резервных копий дисков»; в каталоге отображается
      как «Снимок диска». Оплачивается фактический объём; 1 ГБ = 2³⁰ байт.
