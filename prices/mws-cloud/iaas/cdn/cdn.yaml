apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: mws-cloud
  layer: iaas
  service: cdn
  category: iaas.cdn
  title: Content Delivery Network
spec:
  meters:
  - sku: mws.cdn.traffic.egress
    name: Исходящий трафик CDN
    meter: cdn.traffic.egress
    status: available
    pricingMode: unit
    region: ru-central1
    effectiveFrom: '2026-08-01'
    checkedAt: '2026-08-01'
    sourceRefs: [mws.cdn, mws.all-prices]
    dimensions:
      trafficScope: cdn-to-client
      nativeName: Исходящий трафик с серверов CDN
      nativeUnit: ГБ
      nativeAmountIncluded: '0.8418'
      sourceVatRatePercent: 22
      sourceVat: included
      comparabilityClass: egress-payg
    pricing:
      rate:
        amount: '0.8418'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: included
        byteBasis: binary
    notes: >
      Исходящий трафик с CDN к клиентам. Входящий не тарифицируется. В публичном
      прайсе MWS CDN нет абонплаты за ресурс и нет тарифа за запросы (только
      egress) — поэтому в каталоге нет строк «CDN-ресурс» / «Запросы CDN», в
      отличие от Yandex/Selectel (ресурс) и Yandex/T1 (запросы).

  - sku: mws.cdn.traffic.ingress
    name: Входящий трафик CDN
    meter: cdn.traffic.ingress
    status: available
    pricingMode: unit
    region: ru-central1
    effectiveFrom: null
    checkedAt: '2026-08-01'
    sourceRefs: [mws.cdn, mws.cdn-overview]
    dimensions:
      trafficScope: origin-and-internet-to-cdn
      nativeName: Входящий трафик на CDN-серверы (не тарифицируется)
      nativeUnit: ГБ
      nativeAmountIncluded: '0'
      sourceVat: included
      comparabilityClass: ingress-free
    pricing:
      rate:
        amount: '0'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: included
        byteBasis: binary
    notes: >
      0 ₽: входящий на CDN не тарифицируется (whatis/pricing CDN). Не путать с
      VK, где вход платный. Источники: docs CDN.
