apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: cloud-ru
  layer: iaas
  service: cdn
  category: iaas.cdn
  title: Cloud.ru CDN
spec:
  meters:
  - sku: cloudru.cdn.traffic.egress
    name: Исходящий трафик CDN
    meter: cdn.traffic.egress
    status: available
    pricingMode: tiered
    region: Базовая сеть
    effectiveFrom: '2026-06-12'
    checkedAt: '2026-09-25'
    sourceRefs: [cloudru.cdn-tariffs-crs, cloudru.cdn-tariffs-crs-pdf, cloudru.cdn]
    dimensions:
      trafficScope: cdn-to-client
      coverage: base
      nativeName: Размещение информации на сети CDN, с исходящим трафиком до/более 100 ТБ
      nativeUnit: ГБ
      comparabilityClass: egress-payg
      contractByteUnit: decimal-GB
      sourceVatRatePercent: 22
      sourceDocument: 7.CRS.1
      sourceDocumentVersion: '260602'
    pricing:
      # Первая ступень — трафик до 100 ТБ. Суммы из колонки «Цена с НДС» приложения 7.CRS.1.
      rate:
        amount: '1.098'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: included
        byteBasis: decimal
      tiers:
      # В договоре 100 ТБ = 100 000 десятичных ГБ.
      - from: '0'
        to: '100000'
        rate:
          amount: '1.098'
          currency: RUB
          unit: {quantity: GiB, period: usage}
          vat: included
          byteBasis: decimal
      - from: '100000'
        to: null
        rate:
          amount: '0.854'
          currency: RUB
          unit: {quantity: GiB, period: usage}
          vat: included
          byteBasis: decimal
    notes: >
      Оплачивается только исходящий трафик от узлов CDN к пользователям.
      Трафик внутри сети CDN не тарифицируется. По приложению 7.CRS.1
      до 100 ТБ — 1,098 ₽ за ГБ с НДС 22% (0,90 ₽ без НДС), свыше 100 ТБ —
      0,854 ₽ за ГБ с НДС (0,70 ₽ без НДС). В договоре ГБ десятичный.
      В каталоге то же число, а единица подписана как GiB, как у других
      провайдеров: пересчёта из десятичных ГБ в GiB нет. Абонентской платы
      за ресурс нет.

  - sku: cloudru.cdn.traffic.egress.apac
    name: Исходящий трафик CDN · APAC
    meter: cdn.traffic.egress
    status: available
    pricingMode: unit
    region: APAC
    effectiveFrom: '2026-06-12'
    checkedAt: '2026-09-25'
    sourceRefs: [cloudru.cdn-tariffs-crs, cloudru.cdn-tariffs-crs-pdf, cloudru.cdn]
    dimensions:
      trafficScope: cdn-to-client
      coverage: apac
      nativeName: Размещение информации на сети CDN с улучшенным покрытием в регионах APAC (Индия)
      nativeUnit: ГБ
      comparabilityClass: egress-coverage-addon
      contractByteUnit: decimal-GB
      sourceVatRatePercent: 22
      sourceDocument: 7.CRS.1
      sourceDocumentVersion: '260602'
    pricing:
      rate:
        amount: '6.10'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: included
        byteBasis: decimal
    notes: >
      Улучшенное покрытие APAC. В тарифе строка называется «APAC (Индия)»:
      6,10 ₽ за ГБ с НДС 22% (5,00 ₽ без НДС) по приложению 7.CRS.1.
      ГБ в договоре десятичный. В каталоге то же число под единицей GiB,
      без пересчёта. Это отдельная ставка, она не заменяет базовый исходящий
      трафик CDN.

  - sku: cloudru.cdn.traffic.egress.na-eu
    name: Исходящий трафик CDN · NA/EU
    meter: cdn.traffic.egress
    status: available
    pricingMode: unit
    region: NA/EU
    effectiveFrom: null
    checkedAt: '2026-07-25'
    sourceRefs: [cloudru.cdn-tariffs-pril7, cloudru.cdn]
    dimensions:
      trafficScope: cdn-to-client
      coverage: na-eu
      nativeName: Размещение информации на сети CDN с улучшенным покрытием в регионах NA/EU
      nativeUnit: Гб
      comparabilityClass: egress-coverage-addon
      contractByteUnit: decimal-GB
      sourceVatRatePercent: 20
      sourceDocument: Prilozheniye_7_Tarrifs
    pricing:
      rate:
        amount: '1.32'
        currency: RUB
        unit: {quantity: GiB, period: usage}
        vat: included
        byteBasis: decimal
    notes: >
      Улучшенное покрытие NA/EU — 1,32 ₽ с НДС за договорной Гб (приложение 7:
      1,10 без НДС + 0,22 НДС 20%). В таблице — GiB для единообразия, без
      пересчёта GB→GiB. Источник Prilozheniye_7_Tarrifs.pdf. Отдельный режим
      покрытия, не базовая ставка.

  - sku: cloudru.cdn.origin.shielding
    name: Экранирование источников CDN
    meter: cdn.origin.shielding
    status: available
    pricingMode: fixed
    region: —
    effectiveFrom: null
    checkedAt: '2026-07-25'
    sourceRefs: [cloudru.cdn-tariffs, cloudru.cdn]
    dimensions:
      nativeName: Origin shield
      nativeUnit: шт
      comparabilityClass: optional-addon
      sourceVatRatePercent: 20
      sourceDocument: prilozheniye_7A.CRS.1
      sourceDocumentVersion: '240621'
    pricing:
      rate:
        amount: '6420'
        currency: RUB
        unit: {quantity: resource, period: month}
        vat: included
        byteBasis: not-applicable
    notes: >
      Origin shield — 6 420 ₽/мес с НДС (CRS.1: 5 350 без НДС + 1 070 НДС 20%).
      Опция, не часть PAYG-трафика. Сравнивайте с экранированием Yandex/T1 как
      с аддоном. Источник: приложение 7A.CRS.1.
