      vcpu: 2
      ramGb: 4
      ramGiB: 4
      availability: regional
      faultTolerant: true
      topology: regional
      masterCount: 3
      masterSize: small
      comparabilityClass: synthetic-bundle
      comparableTier: ha
      synthetic: true
      syntheticFrom:
      - cloudru.kubernetes.master-zonal-2-4
      vatRatePercent: 22
      verificationStatus: derived-verified
      verificationMethod: 3x-native-zonal-master-bundle
      verifiedAt: '2026-07-27'
    pricing:
      rate:
        amount: '25.803'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '25.803'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: 3 × 8.601 (zonal master 2 vCPU / 4 GiB, VAT included)
        vat: included
    notes: >
      Синтетическая оценка Cloud FinOps (*), не отдельная строка прайса Cloud.ru.
      Зачем: в прайсе есть зональный мастер 2/4, а HA — это несколько таких
      мастеров (обычно 3, можно 5), без отдельного пакета «HA». Берём 3 × 2/4,
      чтобы сравнить отказоустойчивый слой с другими облаками. Как считаем:
      3 × 8,601 = 25,803 ₽/ч с НДС. Рабочие ноды не входят.
