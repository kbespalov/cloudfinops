apiVersion: cloudfinops.ru/v1alpha1
kind: PriceBook
metadata:
  provider: cloud-ru
  layer: paas
  service: containers
  category: paas.containers.managed-kubernetes
  title: Managed Kubernetes
spec:
  meters:
  - sku: cloudru.kubernetes.master-zonal-2-4
    name: Мастер Kubernetes · зональный · 2 vCPU / 4 ГиБ
    meter: containers.kubernetes.control-plane
    status: available
    pricingMode: bundle
    region: Россия
    effectiveFrom: '2026-06-29'
    checkedAt: '2026-07-17'
    sourceRefs:
    - cloudru.k8s-pdf
    dimensions:
      nativeName: Зональный мастер 2 vCPU / 4 ГиБ
      vcpu: 2
      ramGb: 4
      availability: zonal
      faultTolerant: false
      topology: zonal
      ramGiB: 4
      comparabilityClass: native-bundle
      comparableTier: basic
      masterCount: 1
    pricing:
      rate:
        amount: '8.601'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '8.601'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: native hourly master rate
        vat: included
    notes: >
      Готовый тариф Cloud.ru на один мастер-узел Kubernetes: 2 vCPU и 4 ГиБ
      памяти в одной зоне доступности. Рабочие (worker) ноды в эту цену не входят.
  # Synthetic HA for apples-to-apples compare with Yandex/VK/Selectel/MWS HA.
  # Native tariff lists only «Зональный Мастер» configs; HA is N masters × that rate.
  # Docs: https://cloud.ru/docs/kubernetes-evolution/ug/topics/guides__cluster__create
  # (1 / 3 / 5 master nodes). We use 3× to match peer HA comparables.
  - sku: cloudru.kubernetes.master-ha-2-4.synthetic
    name: Мастер Kubernetes · региональный · 3 × 2 vCPU / 4 ГиБ *
    meter: containers.kubernetes.control-plane
    status: available
    pricingMode: bundle
    region: Россия
    effectiveFrom: '2026-06-29'
    checkedAt: '2026-07-24'
    sourceRefs:
    - cloudru.k8s-pdf
    - cloudru.k8s-docs
    priceProvenance: derived
    dimensions:
      nativeName: Отказоустойчивый мастер 3×(2 vCPU / 4 ГиБ) *
      vcpu: 2
      ramGb: 4
      ramGiB: 4
      availability: regional
      faultTolerant: true
      topology: regional
      masterCount: 3
      comparabilityClass: synthetic-bundle
      comparableTier: ha
      synthetic: true
      syntheticFrom:
      - cloudru.kubernetes.master-zonal-2-4
      vatRatePercent: 22
      verificationStatus: derived-verified
      verificationMethod: 3x-native-zonal-master-bundle
      verifiedAt: '2026-07-24'
    pricing:
      rate:
        amount: '25.803'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '25.803'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: 3 × 8.601 (zonal master 2 vCPU / 4 GiB, VAT included)
        vat: included
    notes: >
      Синтетическая оценка Cloud FinOps (*), не публичный тариф Cloud.ru.
      У Cloud.ru HA Kubernetes — несколько зональных мастеров (обычно 3, можно 5);
      отдельного пакета «HA» в прайсе нет. Считаем три мастера по 2 vCPU / 4 ГиБ:
      3 × 8,601 = 25,803 ₽/ч с НДС — чтобы приблизительно сравнить с HA других
      облаков. Рабочие ноды не входят.
