      Отдельная плата «за региональный (HA) мастер» — 0 ₽. Стоимость — vCPU и
      RAM трёх мастер-узлов. Для сравнения смотрите собранную форму 3×2/8 (*).
  # Orderable minimum in calculator/docs: s-c2-m8 (2 vCPU / 8 GiB).
  - sku: yc.kubernetes.master-basic-2-8.synthetic
    name: Мастер Kubernetes · зональный · 2 vCPU / 8 ГиБ *
    meter: containers.kubernetes.control-plane
    status: available
    pricingMode: bundle
    region: Россия
    effectiveFrom: '2026-05-01'
    checkedAt: '2026-07-27'
    sourceRefs:
    - yc.billing-api
    - yc.kubernetes
    priceProvenance: derived
    dimensions:
      nativeName: s-c2-m8
      hostType: s-c2-m8
      comparabilityClass: synthetic-bundle
      comparableTier: basic
      availability: zonal
      faultTolerant: false
      topology: zonal
      masterCount: 1
      vcpu: 2
      ramGiB: 8
      synthetic: true
      syntheticFrom:
      - yc.kubernetes.master-vcpu
      - yc.kubernetes.master-ram
      - yc.kubernetes.master-zonal
      vatRatePercent: 22
    pricing:
      rate:
        amount: '7.20'
        currency: RUB
        unit:
          quantity: master
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '7.20'
        unit:
          currency: RUB
          quantity: master
          period: hour
        formula: 2 × 1.76 (vCPU) + 8 × 0.46 (GiB-RAM) + 0 (zonal fixed)
        vat: included
    notes: >
      Синтетическая оценка Cloud FinOps (*), не отдельная строка прайса Yandex.
      Зачем: минимальный хост мастера в калькуляторе и доках — s-c2-m8
      (2 vCPU / 8 ГиБ); от него удобно сравнивать зональные мастера с другими
      облаками. Как считаем: 2×1,76 + 8×0,46 = 7,20 ₽/ч с НДС (фикс за мастер —
      0 ₽). Рабочие ноды не входят.
