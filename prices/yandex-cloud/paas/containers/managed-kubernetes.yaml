  - sku: yc.kubernetes.master-vcpu
    name: Ресурсы мастера Kubernetes · vCPU
    meter: containers.kubernetes.control-plane.vcpu
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: '2026-05-01'
    checkedAt: '2026-07-27'
    sourceRefs:
    - yc.billing-api
    - yc.kubernetes
    dimensions:
      nativeName: Master vCPU
      component: master-vcpu
      yandexSkuId: dn2pjj9vapo7724rik0b
      serviceId: dn2af04ph5otc5f23o1h
    pricing:
      rate:
        amount: '1.76'
        currency: RUB
        unit:
          quantity: vCPU
          period: hour
        vat: included
        byteBasis: not-applicable
      normalized:
        amount: '1.76'
        unit:
          currency: RUB
          quantity: vCPU
          period: hour
        formula: native hourly rate
        vat: included
    notes: >
      Ставка за 1 vCPU управляющего слоя (мастера). Готовой «строки мастера»
      в прайсе нет — итоговую цену собирают из vCPU и RAM. В каталоге ниже
      есть собранные формы 2/8 (минимум в консоли) и 2/6 (*).
  - sku: yc.kubernetes.master-ram
    name: Ресурсы мастера Kubernetes · RAM
    meter: containers.kubernetes.control-plane.ram
    status: available
    pricingMode: unit
    region: Россия
    effectiveFrom: '2026-05-01'
    checkedAt: '2026-07-27'
    sourceRefs:
    - yc.billing-api
    - yc.kubernetes
    dimensions:
